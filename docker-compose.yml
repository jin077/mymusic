# ─────────────────────────────────────────────────────────────
# MyMusic — 컨테이너 구성
#
#   docker compose up -d       전부 시작 (백그라운드)
#   docker compose ps          상태 확인
#   docker compose logs -f     로그 실시간
#   docker compose down        전부 정지·삭제 (볼륨은 남음)
#
# ⚠️ 비밀값은 여기 직접 쓰지 않고 .env 파일에서 ${...} 로 읽어온다.
#    .env 는 gitignore 대상 → 커밋되지 않음.
#    (application-secret.properties 를 분리했던 것과 같은 원리)
# ─────────────────────────────────────────────────────────────

services:

  # ── DB : 공식 이미지를 그대로 사용 (build 없음) ──
  db:
    image: mariadb:12
    container_name: practice-db
    environment:
      # 이 4줄이 "MariaDB 설치 → 스키마 생성 → 계정 생성 → 권한 부여"를 대신한다.
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: practice
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      # ⭐ 볼륨: DB 데이터를 컨테이너 "밖"에 보관한다.
      #    컨테이너를 지웠다 다시 만들어도 회원 데이터가 살아남는다.
      #    (컨테이너 안에 두면 docker compose down 할 때 같이 사라짐)
      - db-data:/var/lib/mysql
    healthcheck:
      # DB가 "떴다"와 "접속 받을 준비가 됐다"는 다르다.
      # 이 검사가 통과해야 백엔드를 시작하도록 아래 depends_on 에서 사용한다.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── 백엔드 : 우리 jar가 들어가므로 build 한다 ──
  backend:
    build: ./backend          # ./backend/Dockerfile 을 사용
    container_name: practice-backend
    environment:
      # ⭐ 호스트가 localhost가 아니라 "db" — 컨테이너 서비스 이름이다.
      #    compose가 만든 네트워크 안에서 이름이 곧 주소가 된다.
      #    (localhost 로 쓰면 "백엔드 컨테이너 자신"을 가리켜 실패한다)
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/practice
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # 업로드 폴더. 컨테이너 안 경로이며, 아래 볼륨이 이 자리에 붙는다.
      APP_UPLOAD_DIR: /app/uploads
      # 스프링은 SPRING_DATASOURCE_URL → spring.datasource.url 로 자동 매핑한다
      # (relaxed binding: 대문자·밑줄 → 소문자·점)
    volumes:
      # ⭐ 업로드된 프로필 사진도 볼륨에 보관한다.
      #   컨테이너 안에 두면 이미지를 다시 빌드하거나 컨테이너를 지울 때 사진이 사라진다.
      #   DB 데이터와 같은 이유다 — "컨테이너는 언제든 버릴 수 있어야 한다"
      - uploads:/app/uploads
    # ⭐ ports 를 일부러 적지 않는다 = 백엔드를 외부에 노출하지 않는다.
    #   nginx 컨테이너만 내부 네트워크로 backend:8080 에 접근할 수 있다.
    #   (A2에서 nginx를 앞에 둔 이유 = 백엔드 은닉. 여기서 완성된다)
    #   디버깅하려고 직접 찌르고 싶으면 아래 두 줄의 주석을 잠깐 풀면 된다.
    # ports:
    #   - "8080:8080"
    depends_on:
      db:
        condition: service_healthy   # DB 헬스체크 통과 후에 시작
    restart: unless-stopped          # ⭐ 죽으면 자동 재시작 (systemd Restart=always 와 같은 역할)

  # ── 프론트(React 빌드 결과) + nginx : 유일하게 외부에 열리는 문 ──
  nginx:
    build: ./frontend         # ./frontend/Dockerfile (멀티스테이지)
    container_name: practice-nginx
    ports:
      - "80:80"               # 브라우저가 접속할 유일한 포트
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:                    # 이름만 적어두면 도커가 알아서 관리한다
  uploads:                    # 업로드된 프로필 사진
