spring.application.name=practice

# ===================================================================
# ⭐ 민감정보 분리
# ===================================================================
# DB 비밀번호·JWT 서명키 같은 값은 이 파일에 두지 않는다.
#   이 파일은 깃허브에 올라가고, jar 안에도 함께 포장되기 때문이다.
#
# 아래 한 줄이 프로젝트 루트의 application-secret.properties 를 추가로 읽어온다.
#   - optional: → 파일이 없어도 오류가 나지 않는다(운영 환경에서는 환경변수를 쓰므로)
#   - file:./  → jar 내부가 아니라 "실행하는 폴더"에서 찾는다
#                 → 비밀값이 jar 안에 들어가지 않는다 (중요)
#
# 값을 주는 방법 2가지:
#   1) 개발(내 PC) : application-secret.properties 파일   ← .gitignore로 제외됨
#   2) 운영(배포)   : 환경변수
#        SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD / JWT_SECRET
#        (스프링은 점(.)을 밑줄(_)로, 소문자를 대문자로 바꾼 환경변수를 자동으로 인식한다)
# ===================================================================
spring.config.import=optional:file:./application-secret.properties

# ===== MariaDB 연결 =====
# 접속 주소는 비밀이 아니므로 여기 둔다. 계정·비밀번호는 위에서 설명한 곳에서 온다.
spring.datasource.url=jdbc:mariadb://localhost:3306/practice
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===== JPA / Hibernate =====
# ddl-auto=update : 엔티티(@Entity) 변경을 테이블에 자동 반영 (학습용으로 편리)
spring.jpa.hibernate.ddl-auto=update
# 실행되는 SQL을 콘솔에 보여줌 (학습에 좋음)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT 설정 =====
# jwt.secret : 토큰에 서명(위조 방지 도장)할 비밀키 → 민감정보이므로 여기 없음
# jwt.expiration : 토큰 유효시간(밀리초). 3600000ms = 1시간 (비밀이 아니므로 여기 둠)
jwt.expiration=3600000
