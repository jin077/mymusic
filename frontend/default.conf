# 컨테이너용 nginx 설정 (server 블록만).
# nginx 공식 이미지가 /etc/nginx/conf.d/*.conf 를 자동으로 불러오므로
# events·http 블록은 적지 않는다.
#
# ⚠️ Windows용 nginx/nginx.conf 와 두 군데가 다르다:
#   ① root      C:/Users/... → /usr/share/nginx/html  (컨테이너 안 경로)
#   ② proxy_pass localhost   → backend                (compose 서비스 이름)

server {
    listen       80;
    server_name  localhost;

    # ── 규칙 1: /api/... → 백엔드 컨테이너로 전달 ──
    #   ⭐ 호스트명이 'backend' — docker-compose.yml의 서비스 이름이다.
    #     compose가 만든 네트워크 안에서 이름이 그대로 주소가 된다.
    #     localhost 라고 쓰면 "nginx 컨테이너 자신"을 가리켜 502가 난다.
    #   ⭐ proxy_pass 끝에 슬래시를 붙이지 않아야 /api 접두사가 유지된다.
    location /api/ {
        proxy_pass http://backend:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 규칙 2: 업로드된 프로필 사진 → 백엔드 컨테이너로 전달 ──
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # ── 규칙 3: 그 외 모든 요청 → React 빌드 결과물 서빙 ──
    location / {
        root  /usr/share/nginx/html;
        index index.html;

        # SPA fallback: 실제 파일이 없으면 index.html을 준다.
        # React Router로 /chart 같은 주소를 만들어도 새로고침 시 404가 안 나게 한다.
        try_files $uri $uri/ /index.html;
    }
}
