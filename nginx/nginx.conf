
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;              # .js .css .html 등 파일 종류별 Content-Type 표를 불러옴
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;                   # 이 서버는 80번 포트에서 요청을 받는다 (http 기본 포트)
        server_name  localhost;

        # ── 규칙 1: API 요청 (/api/...) → 뒤의 백엔드 jar(8080)로 전달 (리버스 프록시) ──
        #   ⚠️ proxy_pass 끝에 슬래시(/)를 "붙이지 않는다".
        #      → 그래야 /api 접두사를 그대로 유지한 채 넘김: /api/login → localhost:8080/api/login
        #        (백엔드가 /api/login 으로 매핑돼 있으므로 접두사를 지우면 안 됨)
        location /api/ {
            proxy_pass http://localhost:8080;

            # 백엔드가 "원래 요청이 누구에게, 어디서 왔는지" 알 수 있도록 정보를 실어 보냄(실무 관례)
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── 규칙 2: 그 외 모든 요청 → 프론트 빌드 결과물(dist)을 직접 서빙 ──
        location / {
            root  C:/Users/82102/Desktop/new/practice/frontend/dist;   # 정적파일들이 있는 폴더
            index index.html;

            # try_files: 요청한 파일이 실제로 있으면 그걸 주고($uri),
            #   없으면 index.html을 돌려준다(/index.html).
            #   → 나중에 React Router로 URL을 나눠도(예: /about) 새로고침 시 404가 안 나게 하는 SPA 필수 설정.
            try_files $uri $uri/ /index.html;
        }
    }
}
